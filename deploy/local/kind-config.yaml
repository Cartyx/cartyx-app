kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cartyx-local
nodes:
  - role: control-plane
    extraPortMappings:
      # Host localhost:1999 -> Service NodePort 30199 -> container 1999.
      # Lets the web app reach the realtime service at localhost:1999 with no port-forward.
      - containerPort: 30199
        hostPort: 1999
        protocol: TCP
      # Host localhost:3200 -> Service NodePort 30320 -> web container 3000.
      # 3000 stays free for `vite dev`, 3100 for the compose stack.
      - containerPort: 30320
        hostPort: 3200
        protocol: TCP
