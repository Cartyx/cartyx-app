# Production-shaped defaults for the cartyx app chart (web + realtime).
# Per-environment overrides: values-prod.yaml / values-dev.yaml.
# Local kind overrides: values-local.yaml.
#
# Image tags are REQUIRED at install time (immutable git-sha tags, e.g.
# prod-a1b2c3d) — committed files here never pin a tag and `latest` never
# deploys. On the real cluster the Flux HelmRelease values (in the
# cartyx-infrastructure repo, bumped by CI) carry the live tags. Secret
# values are never committed: the cluster uses a kubectl-created Secret via
# secret.existingSecret; the kind path injects from .env via --set-string.

web:
  image:
    repository: ghcr.io/biozal/cartyx-web
    tag: ''
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null # honored only when type is NodePort
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi # no CPU limit — avoids event-loop throttling
  # Plain (non-secret) server-read env, live at deploy time. Empty values are
  # omitted from the pod. VITE_PUBLIC_* client values are NOT here — they are
  # baked into the image at build time from deploy/build/web-<env>.args, so a
  # client flag/host change means an image rebuild, not a helm change.
  env:
    APP_ENV: production
    PORT: '3000'
    BASE_URL: ''
    GOOGLE_CLIENT_ID: ''
    GITHUB_CLIENT_ID: ''
    R2_ACCOUNT_ID: ''
    R2_BUCKET: ''
    CDN_URL: ''
    # DSNs/website IDs are not secrets — they ship in the client bundle too
    # (VITE_PUBLIC_* counterparts in deploy/build/web-<env>.args). Absent =
    # telemetry disabled (see app/server/utils/telemetry.ts).
    GLITCHTIP_DSN: ''
    UMAMI_WEBSITE_ID: ''
    UMAMI_HOST: ''

realtime:
  image:
    repository: ghcr.io/biozal/cartyx-realtime
    tag: ''
    pullPolicy: IfNotPresent
  # MUST stay 1: rooms and relay state live in per-pod in-memory maps with no
  # cross-pod sharing or sticky session routing. Scaling this out silently
  # splits clients into disjoint rooms. Raising it requires sticky routing or
  # external room state (e.g. Redis) first. The deployment template enforces
  # this with a `fail` guard.
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  env:
    PORT: '1999'

audioWorker:
  image:
    repository: ghcr.io/biozal/cartyx-audio-worker
    tag: ''
    pullPolicy: IfNotPresent
  # Safe to scale. Two things make that true together, and the atomic claim is
  # only the first of them: `claimNext` takes a row with a single
  # findOneAndUpdate, AND every terminal write is fenced on
  # `claimedBy` + `status: processing`, so a worker whose claim the reaper
  # revoked mid-job writes nothing instead of overwriting the row a second
  # worker now owns. Atomic claiming alone was never exclusive ownership,
  # because reapStale can hand a live claim away.
  # Kept at 1 because the single-node cluster has no spare CPU headroom.
  replicaCount: 1
  # CPU limits matter here: ffmpeg is CPU-bound and a bulk import must not
  # starve SSR in the web pod.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 768Mi
  # Recreate, not RollingUpdate: the default strategy starts the new pod before
  # the old one terminates, so every deploy briefly runs TWO workers even at
  # replicas: 1 — both claiming, both transcoding, on a node with one spare
  # core. realtime sets this for the same class of reason.
  strategy: Recreate
  # Long enough for an in-flight transcode to finish after SIGTERM (the worker
  # stops claiming and drains the current asset). The default 30s is shorter
  # than a legitimate 30-minute-source transcode, so every rollout SIGKILLed a
  # live job and burned one of its three attempts. 900s covers a real
  # worst-case asset with headroom without letting a pathological one hold a
  # rollout open for the full ~45 minute claim budget — the liveness probe is
  # what handles that case.
  terminationGracePeriodSeconds: 900
  env:
    POLL_INTERVAL_MS: '5000'
    # 60 minutes, and it is TIED TO FFMPEG_TIMEOUT_MS: one asset spawns seven
    # capped ffmpeg/ffprobe children (probe, analyze, 2 transcodes, 2 rendition
    # probes, peaks) = 7 x 300s = 2100s, plus ~600s of bounded R2 time. The old
    # 600000 was below that worst case, i.e. it instructed the reaper to revoke
    # the claims of HEALTHY workers. Raise FFMPEG_TIMEOUT_MS and this must move
    # with it. See audio-worker/src/config.ts.
    CLAIM_TIMEOUT_MS: '3600000'
    # Wall-clock cap on any single ffmpeg/ffprobe invocation. The worker is one
    # sequential loop and the stale-row reaper runs inside it, so a hung child
    # process wedges the whole queue until the pod is restarted. Measured: a
    # 30-minute source (the hard cap) costs ~45s CPU for the Opus leg and ~51s
    # for the AAC leg on a fast core, so this is a small multiple of real work
    # on this node, not slack — lowering it risks killing healthy transcodes.
    FFMPEG_TIMEOUT_MS: '300000'
    # A row stuck in `uploading` past this age is failed: presigned PUT URLs
    # expire after 300s, so nothing can confirm it any more.
    UPLOAD_TIMEOUT_MS: '900000'
    # R2 request/connect timeouts. The AWS SDK's Node handler has NO request
    # timeout by default, which made these the only unbounded awaits in the
    # loop: a half-open socket hangs processAsset, which hangs the loop, which
    # stops the reaper that lives inside it.
    S3_REQUEST_TIMEOUT_MS: '60000'
    S3_CONNECT_TIMEOUT_MS: '10000'
    # Liveness: the worker touches HEARTBEAT_FILE after every pipeline stage,
    # and `node dist/healthcheck.js` fails once it is older than this. Sized
    # against the longest single stage (FFMPEG_TIMEOUT_MS), not the longest
    # asset — a per-asset threshold would be too generous to catch anything.
    HEARTBEAT_FILE: /tmp/audio-worker-heartbeat
    HEARTBEAT_MAX_AGE_MS: '600000'

ingress:
  enabled: true
  className: traefik
  webHost: '' # e.g. app.cartyx.io — required when ingress.enabled
  wsHost: '' # e.g. ws.cartyx.io — required when ingress.enabled
  # 403 /healthz + /readyz at the ingress (Traefik Middleware + IngressRoute).
  # Kubelet probes hit pods directly and are unaffected.
  blockHealthEndpoints: true

tls:
  secretName: cartyx-tls
  # On cluster z440 certificates are owned by the cartyx-infrastructure repo
  # (per-env, deliberately not a wildcard) — values-prod/dev DISABLE this and
  # point secretName at the infra-issued secrets. Enable it only on clusters
  # where nothing else issues the cert.
  certificate:
    enabled: true # cert-manager Certificate covering [webHost, wsHost]
    clusterIssuer: '' # required when enabled — find it: kubectl get clusterissuer

secret:
  create: true
  # Name of a pre-created Secret holding the same keys; when set, the chart
  # does not manage a Secret and the checksum-restart behavior is inert
  # (immutable image tags force rollouts anyway). Cluster z440 sets `cartyx`
  # (created out-of-band with kubectl — see README); the kind path leaves
  # this empty and uses the chart-managed Secret.
  existingSecret: ''
  values:
    sessionSecret: '' # required; >=32 chars when APP_ENV is production/staging
    mongodbUri: '' # required
    googleClientSecret: ''
    githubClientSecret: ''
    r2AccessKeyId: ''
    r2SecretAccessKey: ''

nameOverride: ''
fullnameOverride: ''
