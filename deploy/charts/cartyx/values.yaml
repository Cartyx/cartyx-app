# Production-shaped defaults for the cartyx app chart (web + realtime).
# Per-environment overrides: values-prod.yaml / values-dev.yaml.
# Local kind overrides: values-local.yaml.
#
# Image tags are REQUIRED at install time (immutable git-sha tags, e.g.
# prod-a1b2c3d) — committed files here never pin a tag and `latest` never
# deploys. On the real cluster the Flux HelmRelease values (in the
# cartyx-infrastructure repo, bumped by CI) carry the live tags. Secret
# values are never committed: the cluster uses a kubectl-created Secret via
# secret.existingSecret; the kind path injects from .env via --set-string.

web:
  image:
    repository: ghcr.io/biozal/cartyx-web
    tag: ''
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null # honored only when type is NodePort
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi # no CPU limit — avoids event-loop throttling
  # Plain (non-secret) server-read env, live at deploy time. Empty values are
  # omitted from the pod. VITE_PUBLIC_* client values are NOT here — they are
  # baked into the image at build time from deploy/build/web-<env>.args, so a
  # client flag/host change means an image rebuild, not a helm change.
  env:
    APP_ENV: production
    PORT: '3000'
    BASE_URL: ''
    GOOGLE_CLIENT_ID: ''
    GITHUB_CLIENT_ID: ''
    R2_ACCOUNT_ID: ''
    R2_BUCKET: ''
    CDN_URL: ''
    # DSNs/website IDs are not secrets — they ship in the client bundle too
    # (VITE_PUBLIC_* counterparts in deploy/build/web-<env>.args). Absent =
    # telemetry disabled (see app/server/utils/telemetry.ts).
    GLITCHTIP_DSN: ''
    UMAMI_WEBSITE_ID: ''
    UMAMI_HOST: ''
    # Audio hardening (phase 1.5) operator-tunable limits — all three are
    # guarded against an absent/empty value (Helm renders '' for an unset key
    # here; the readers in app/server/functions/audio.ts and
    # app/lib/audio-rate-limits.ts treat that the same as "not set" and fall
    # back to the documented default) and take effect on the next pod
    # restart, no image rebuild. See deploy/charts/cartyx/README.md's
    # Operations section for the operator-facing writeup of each default and
    # where to change it.
    #
    # Per-user storage quota in bytes. Default (when unset): 2 GiB — see
    # DEFAULT_AUDIO_USER_QUOTA_BYTES in app/server/functions/audio.ts.
    AUDIO_USER_QUOTA_BYTES: ''
    # Per-user cap on pending/processing transcode jobs at once. Default
    # (when unset): 20 — see DEFAULT_MAX_PENDING_JOBS_PER_USER in
    # app/server/functions/audio.ts.
    MAX_PENDING_JOBS_PER_USER: ''
    # Token-bucket size/refill for the audio ingest rate limiter (upload
    # presign, confirm, once-variant, retry). Defaults (when unset): capacity
    # 60, refill 1/s — see audioIngestLimiter in app/lib/audio-rate-limits.ts.
    # The other four rate-limit buckets in that file are deliberately NOT
    # env-wired (see that file's module comment for why).
    AUDIO_INGEST_RATE_LIMIT_CAPACITY: ''
    AUDIO_INGEST_RATE_LIMIT_REFILL_PER_SEC: ''

realtime:
  image:
    repository: ghcr.io/biozal/cartyx-realtime
    tag: ''
    pullPolicy: IfNotPresent
  # MUST stay 1: rooms and relay state live in per-pod in-memory maps with no
  # cross-pod sharing or sticky session routing. Scaling this out silently
  # splits clients into disjoint rooms. Raising it requires sticky routing or
  # external room state (e.g. Redis) first. The deployment template enforces
  # this with a `fail` guard.
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  env:
    PORT: '1999'

audioWorker:
  image:
    repository: ghcr.io/biozal/cartyx-audio-worker
    tag: ''
    pullPolicy: IfNotPresent
  # Safe to scale. Two things make that true together, and the atomic claim is
  # only the first of them: `claimNext` takes a row with a single
  # findOneAndUpdate, AND every terminal write is fenced on
  # `claimedBy` + `status: processing`, so a worker whose claim the reaper
  # revoked mid-job writes nothing instead of overwriting the row a second
  # worker now owns. Atomic claiming alone was never exclusive ownership,
  # because reapStale can hand a live claim away.
  # Kept at 1 because one worker now clears the worst-case asset well inside
  # its timeouts (see the resources block), not because the node is full — z440
  # has 36 cores / 62 GiB and sits at ~7%. A second replica buys throughput on a
  # bulk import and nothing else; add it when import latency is the complaint.
  replicaCount: 1
  # ffmpeg is CPU-bound, so this is the one pod in the chart with a CPU LIMIT
  # (web and realtime deliberately have none — throttling an event loop is
  # worse than letting it burst). Both numbers are sized from measurements
  # taken in-pod on the deployed image, against the worst realistic source:
  # 30 minutes, 5 additive tones, 128 kbit/s MP3, 28.8 MB.
  #
  #   limits.cpu   The ceiling exists to stop a bulk import starving SSR in the
  #                web pod, NOT because the node lacks headroom. 4 is ~11% of a
  #                36-core box idling at 7%, and it takes the binding leg (aac)
  #                to 49s — a 6x margin under FFMPEG_TIMEOUT_MS (300s) instead
  #                of the 1.46x that `cpu: 1` gave (205s measured, in-pod).
  #                That margin is the whole point: a timeout is a SIGKILL, which
  #                is a transient failure, which is three attempts of ~205s each
  #                before the asset lands `failed` — ten minutes of burnt CPU to
  #                permanently reject a legitimate upload.
  #                4 rather than 1 also stops the cgroup being the binding
  #                constraint at all: with `-threads 1` (see `SINGLE_THREAD` in
  #                audio-worker/src/ffmpeg.ts) ffmpeg still runs ~6 pipeline
  #                threads, and 49s at cpu=6 vs 49s at cpu=4-with-1-thread is
  #                the same number — the encode is effectively single-threaded,
  #                so anything past a small multiple of one core buys nothing.
  #   requests.cpu The scheduler reservation AND the cgroup's share weight under
  #                contention. At the old 100m the worker was weighted at a
  #                tenth of a core against the web pod's 100m + burst, i.e. it
  #                lost the CPU it needs continuously while transcoding. 1 is
  #                what a transcode actually uses steadily, it is 2.8% of the
  #                node, and keeping it below the limit leaves the pod
  #                Burstable rather than Guaranteed.
  resources:
    requests:
      cpu: '1'
      memory: 256Mi
    limits:
      cpu: '4'
      memory: 768Mi
  # Recreate, not RollingUpdate: the default strategy starts the new pod before
  # the old one terminates, so every deploy briefly runs TWO workers even at
  # replicas: 1 — both claiming, both transcoding, and (with limits.cpu: 4)
  # between them entitled to 8 cores plus whatever the terminating pod is still
  # holding. realtime sets this for the same class of reason.
  strategy: Recreate
  # Long enough for an in-flight transcode to finish after SIGTERM (the worker
  # stops claiming and drains the current asset). The default 30s is shorter
  # than a legitimate 30-minute-source transcode, so every rollout SIGKILLed a
  # live job and burned one of its three attempts. 900s covers a real
  # worst-case asset with headroom without letting a pathological one hold a
  # rollout open for the full ~45 minute claim budget — the liveness probe is
  # what handles that case.
  terminationGracePeriodSeconds: 900
  env:
    POLL_INTERVAL_MS: '5000'
    # 60 minutes, and it is TIED TO FFMPEG_TIMEOUT_MS: one asset spawns seven
    # capped ffmpeg/ffprobe children (probe, analyze, 2 transcodes, 2 rendition
    # probes, peaks) = 7 x 300s = 2100s, plus ~600s of bounded R2 time. The old
    # 600000 was below that worst case, i.e. it instructed the reaper to revoke
    # the claims of HEALTHY workers. Raise FFMPEG_TIMEOUT_MS and this must move
    # with it. See audio-worker/src/config.ts.
    CLAIM_TIMEOUT_MS: '3600000'
    # Wall-clock cap on any single ffmpeg/ffprobe invocation. The worker is one
    # sequential loop and the stale-row reaper runs inside it, so a hung child
    # process wedges the whole queue until the pod is restarted. Sized against
    # work MEASURED IN-POD on the deployed image, not on a laptop: the worst
    # realistic 30-minute source (the hard cap) costs 26s for the Opus leg and
    # 49s for the binding AAC leg at the resources set above, so this is ~6x
    # real work. It was 1.46x at `cpu: 1` with ffmpeg's default thread count
    # (205s for the same leg) — close enough that an ordinary long upload could
    # be SIGKILLed as if it had hung. Lowering either this or limits.cpu walks
    # back toward that, and both legs must keep clearing it with room.
    FFMPEG_TIMEOUT_MS: '300000'
    # A row stuck in `uploading` past this age is failed: presigned PUT URLs
    # expire after 300s, so nothing can confirm it any more.
    UPLOAD_TIMEOUT_MS: '900000'
    # R2 request/connect timeouts. The AWS SDK's Node handler has NO request
    # timeout by default, which made these the only unbounded awaits in the
    # loop: a half-open socket hangs processAsset, which hangs the loop, which
    # stops the reaper that lives inside it.
    S3_REQUEST_TIMEOUT_MS: '60000'
    S3_CONNECT_TIMEOUT_MS: '10000'
    # Liveness: the worker touches HEARTBEAT_FILE after every pipeline stage,
    # and `node dist/healthcheck.js` fails once it is older than this. Sized
    # against the longest single stage (FFMPEG_TIMEOUT_MS), not the longest
    # asset — a per-asset threshold would be too generous to catch anything.
    HEARTBEAT_FILE: /tmp/audio-worker-heartbeat
    HEARTBEAT_MAX_AGE_MS: '600000'
    # Wired so the worker can be turned up to debug WITHOUT an image rebuild —
    # `helm upgrade --set audioWorker.env.LOG_LEVEL=debug` (or the value in the
    # infra repo's HelmRelease) and a pod restart. Before this it was read from
    # the environment but settable nowhere, so raising it at 2am meant a code
    # change, a CI run, an image push and a Flux reconcile.
    # Only pino's levels are accepted; anything else falls back to `info`
    # (`logLevel` in audio-worker/src/config.ts) because pino THROWS on an
    # unknown level at import time, which would be a crash loop rather than a
    # noisy log.
    LOG_LEVEL: info
    # Delay before a failed asset is eligible again: 30s, 60s, 120s… capped.
    # Without a delay all three attempts burn back-to-back in milliseconds and
    # the transient failures retries exist to survive (an R2 blip, a brief
    # Atlas failover) still end in a permanent `failed`. Raising the base is
    # the lever for an ongoing R2 incident; it is TIED TO CLAIM_TIMEOUT_MS only
    # in the sense that a very large max delays recovery, not correctness.
    RETRY_BACKOFF_MS: '30000'
    RETRY_BACKOFF_MAX_MS: '300000'

ingress:
  enabled: true
  className: traefik
  webHost: '' # e.g. app.cartyx.io — required when ingress.enabled
  wsHost: '' # e.g. ws.cartyx.io — required when ingress.enabled
  # 403 /healthz + /readyz at the ingress (Traefik Middleware + IngressRoute).
  # Kubelet probes hit pods directly and are unaffected.
  blockHealthEndpoints: true

tls:
  secretName: cartyx-tls
  # On cluster z440 certificates are owned by the cartyx-infrastructure repo
  # (per-env, deliberately not a wildcard) — values-prod/dev DISABLE this and
  # point secretName at the infra-issued secrets. Enable it only on clusters
  # where nothing else issues the cert.
  certificate:
    enabled: true # cert-manager Certificate covering [webHost, wsHost]
    clusterIssuer: '' # required when enabled — find it: kubectl get clusterissuer

secret:
  create: true
  # Name of a pre-created Secret holding the same keys; when set, the chart
  # does not manage a Secret and the checksum-restart behavior is inert
  # (immutable image tags force rollouts anyway). Cluster z440 sets `cartyx`
  # (created out-of-band with kubectl — see README); the kind path leaves
  # this empty and uses the chart-managed Secret.
  existingSecret: ''
  values:
    sessionSecret: '' # required; >=32 chars when APP_ENV is production/staging
    mongodbUri: '' # required
    googleClientSecret: ''
    githubClientSecret: ''
    r2AccessKeyId: ''
    r2SecretAccessKey: ''

nameOverride: ''
fullnameOverride: ''
