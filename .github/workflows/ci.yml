name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches-ignore: [main]

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Package age guard (supply-chain defence)
        # Fail if any direct dep was published less than MIN_AGE_DAYS (10) ago.
        # Mirrors the `cooldown` rule in `.github/dependabot.yml`. To bypass
        # for an emergency CVE fix, set SKIP_AGE_CHECK=1 in the workflow run
        # and document in the PR. STRICT_AGE_CHECK=1 also gates transitives.
        #
        # Rollout `continue-on-error` removed 2026-06-15: the #432 lockfile
        # regeneration has aged past the 10-day window, so this step is now
        # blocking as intended.
        run: npm run check:deps-age

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
        env:
          SESSION_SECRET: ci-test-secret-at-least-32-characters-long
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  services:
    name: Services (realtime + audio-worker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [realtime, audio-worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      # ffprobe/ffmpeg are required by audio-worker's integration test, which
      # deliberately runs the real binaries — mocking them would test nothing.
      - name: Install ffmpeg
        if: matrix.service == 'audio-worker'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        working-directory: ${{ matrix.service }}

      - name: Type check
        run: npm run typecheck
        working-directory: ${{ matrix.service }}

      - name: Tests
        run: npm test
        working-directory: ${{ matrix.service }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: build-placeholder-secret-at-least-32-chars
          NODE_ENV: production
          BASE_URL: https://cartyx.io

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    needs: quality
    # `test:ci` runs `--project unit` only, so before this job nothing verified
    # the stories. They had rotted accordingly: the preview build failed
    # outright (the app's nitro/tanstackStart plugins leaking into the Storybook
    # vite config) and, once that was fixed, 17 stories threw — mostly missing
    # required props that had been added to components without updating their
    # fixtures. Keep this job so that cannot happen again silently.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The storybook vitest project runs stories in a real browser
      # (@vitest/browser-playwright), so the chromium binary is required.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run story tests
        run: npm run test:storybook

      # Catches build-only breakage the test run can miss (chunking, static
      # assets, the manifest plugins that broke it originally).
      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    # E2E is heavier than the unit suite (spins up Mongo + the dev server and
    # drives a real browser), so we only run it on PRs — not on every branch
    # push. The repo convention is PRs target `dev`/`main` (see the top-level
    # `on:` block), so this still gates every change before it merges.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    services:
      # Ephemeral MongoDB for the run — no external/Atlas secret required.
      # The suite refuses any URI matching /prod/i (see e2e/globalSetup.ts),
      # and this DB is torn down with the job.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Reuse the same throwaway value pattern as the unit-test job; this is a
      # test fixture, not a secret.
      SESSION_SECRET: ci-test-secret-at-least-32-characters-long
      # The db name must be in the URI path: the app's connectDB() calls
      # mongoose.connect(uri) WITHOUT a dbName option, so a bare host URI
      # sends the app to mongoose's default `test` database while globalSetup,
      # seed-gm.cjs, dev_seed.py, and the specs all honor MONGODB_DB — a
      # split-brain where the app can't see any seeded/provisioned data.
      # MONGODB_DB stays for the tooling that reads it; both resolve to the
      # same database.
      MONGODB_URI: mongodb://localhost:27017/cartyx_e2e
      MONGODB_DB: cartyx_e2e
      NODE_ENV: test
      # The dev server reads BASE_URL when building OAuth redirect URIs and for
      # isOAuthConfigured(); point it at the Playwright dev-server origin so no
      # code path throws on a missing BASE_URL even though e2e uses a pre-minted
      # session cookie rather than the live OAuth flow.
      BASE_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: 'npm'

      - name: Set up Python (for the DB seed)
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Create Python venv for seed scripts
        run: |
          python -m venv scripts/.venv
          scripts/.venv/bin/pip install -r scripts/requirements.txt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed database
        # globalSetup.ts looks up a GM user + seeded campaign/location/screen.
        # seed-gm.cjs bootstraps the GM user, then dev:seed populates campaigns.
        run: |
          node scripts/seed-gm.cjs
          npm run dev:seed

      - name: Run Playwright tests
        # Retries (2) and webServer timeout are configured in playwright.config.ts
        # so a slow cold first-route compile of the dev server doesn't flake the run.
        #
        # The dummy R2/CDN env lives on THIS step only (the Playwright-spawned
        # dev server needs it): the gallery upload flow requires CDN_URL + all
        # four R2 vars just to MINT a presigned URL (offline HMAC — no
        # network); the browser PUT is intercepted by mockR2DirectUpload.
        # Keep these OFF the job env — dev_seed.py syncs seed images against
        # R2 whenever credentials are present, and a fake account id dies on
        # the TLS handshake, killing the seed step.
        env:
          CDN_URL: https://cdn-e2e.example.invalid
          R2_ACCOUNT_ID: e2e-dummy-account
          R2_ACCESS_KEY_ID: e2e-dummy-key
          R2_SECRET_ACCESS_KEY: e2e-dummy-secret
          R2_BUCKET: e2e-dummy-bucket
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Chart render tests (includes helm lint)
        # helm ships preinstalled on ubuntu-latest runners.
        run: bash deploy/charts/cartyx/tests/render-tests.sh
