name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches-ignore: [main]

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

      - name: Package age guard (supply-chain defence)
        # Fail if any direct dep was published less than MIN_AGE_DAYS (10) ago.
        # Mirrors the `cooldown` rule in `.github/dependabot.yml`. To bypass
        # for an emergency CVE fix, set SKIP_AGE_CHECK=1 in the workflow run
        # and document in the PR. STRICT_AGE_CHECK=1 also gates transitives.
        #
        # `continue-on-error: true` during rollout — the existing lockfile
        # was regenerated recently (#432) and has ~20 direct deps published
        # in the last 10 days. They will age out by ~2026-06-11, after
        # which this flag should be removed so the step becomes blocking.
        # TODO(2026-06-12): drop `continue-on-error` once the lockfile ages.
        continue-on-error: true
        run: npm run check:deps-age

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
        env:
          SESSION_SECRET: ci-test-secret-at-least-32-characters-long
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: build-placeholder-secret-at-least-32-chars
          NODE_ENV: production
          BASE_URL: https://cartyx.io
