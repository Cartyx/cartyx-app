version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    # Cooldown — wait 10 days after a version is published before opening
    # a PR for it. Defends against supply-chain attacks where a compromised
    # maintainer publishes a malicious version: 10 days is well within the
    # typical window for the npm community to spot and yank. The CI guard
    # in `scripts/check-package-age.mjs` enforces the same threshold on
    # manual installs.
    cooldown:
      default-days: 10
    ignore:
      # Only accept patch and minor updates for major version packages
      - dependency-name: 'mongoose'
        update-types: ['version-update:semver-major']

      # --- FontAwesome 7 boundary ---
      # FontAwesome 7 is a major architectural rewrite that breaks
      # compatibility with @fortawesome/react-fontawesome v3 and our
      # pro-solid-svg-icons vendor bundle. Hold at v6 until the full
      # FontAwesome 7 ecosystem (react-fontawesome, icon packages) is stable.
      - dependency-name: '@fortawesome/fontawesome-svg-core'
        versions: ['>=7.0.0']

      # --- Vite 8 boundary: these versions require Vite 8 / Rolldown ---
      # Vite 8 switches from Rollup to Rolldown and breaks our React Compiler
      # babel plugin setup in vite.config.ts. Hold at Vite 7 until React
      # Compiler has native Rolldown/Oxc support.
      - dependency-name: 'vite'
        versions: ['>=8.0.0']
      # plugin-react 5.2+ requires Vite 8; 6.x removes Babel entirely,
      # which breaks babel-plugin-react-compiler integration.
      - dependency-name: '@vitejs/plugin-react'
        versions: ['>=5.2.0']
      # vitest 5+ will likely require Vite 8 (vitest 4.x supports Vite 7)
      - dependency-name: 'vitest'
        versions: ['>=5.0.0']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=5.0.0']
      - dependency-name: '@vitest/browser-playwright'
        versions: ['>=5.0.0']

      # --- ESLint 10 boundary ---
      # ESLint 10 introduces breaking rule-API changes and removes legacy
      # (eslintrc) config support; typescript-eslint v9 pairs with it. Hold
      # at ESLint 9 + typescript-eslint v8 until the upgrade is validated.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']
      - dependency-name: '@typescript-eslint/eslint-plugin'
        versions: ['>=9.0.0']
      - dependency-name: '@typescript-eslint/parser'
        versions: ['>=9.0.0']

      # --- TanStack Router/Start lockstep ---
      # @tanstack/react-start pins an EXACT @tanstack/react-router version
      # (e.g. react-start 1.168.25 → react-router 1.170.15; they version on
      # different release trains). A standalone react-router bump leaves two
      # copies of @tanstack/router-core in the tree and breaks the SSR build
      # with missing-export errors. Never bump react-router on its own —
      # move it manually alongside each react-start update, matching the
      # exact version react-start declares in its dependencies.
      - dependency-name: '@tanstack/react-router'

      # --- zod 5 boundary ---
      # zod 5 will be the next breaking release after 4. The 3→4 migration
      # (PR #439) renamed errorMap → error and required explicit key schemas
      # on z.record(); hold at v4 until we're ready to vet the next break.
      - dependency-name: 'zod'
        versions: ['>=5.0.0']

      # --- TypeScript 7 boundary ---
      # TypeScript follows a roughly 6-month major cadence and routinely
      # ships breaking type-checker changes. Hold at v6 to keep upgrades
      # an intentional, manually-validated step rather than a surprise PR.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(actions)'
